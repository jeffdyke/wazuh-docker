services:
  wazuh-warm1.indexer:
    image: wazuh/wazuh-indexer:4.14.1
    hostname: wazuh-warm1.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - "bootstrap.memory_lock=true"
      - "WAZUH_INDEXER_NODE_TYPE=warm"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "1.5"
    volumes:
      - wazuh-indexer-data-warm-1:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh-warm1.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh-warm1.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh-warm1.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh-warm1.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh-warm1.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml

volumes:
  wazuh-indexer-data-warm-1:
